# Build and deploy Vite React app to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Actions are pinned to exact patch versions on purpose: a floating `@v4` moves
    # with every upstream release without review. Bump deliberately and re-run.
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  # A separate job on purpose. Uploading and deploying in one job races the
  # artifacts API: on 2026-11-26 two runs failed with "Found 0 artifact(s)"
  # although the upload step was green and the artifact existed seconds later.
  # `needs: build` starts the deploy only after the upload job has finished, so
  # the artifact is registered before deploy-pages looks it up.
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
